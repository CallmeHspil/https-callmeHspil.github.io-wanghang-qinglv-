<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width,initial‑scale=1.0">
<title>小说阅读</title>
<style>
*{box‑sizing:border‑box;margin:0;padding:0;}
body{max‑width:680px;margin:0 auto;padding:20px 16px;font‑size:18px;line‑height:1.8;background:#f8f5f0;color:#222;}
.dark{background:#1a1a1a;color:#ddd;}
.ctrl{margin‑bottom:16px;display:flex;gap:10px;flex‑wrap:wrap;}
button{padding:6px 12px;border:none;border‑radius:6px;background:#4488dd;color:white;}
#content{white‑space:pre‑wrap;}
</style>
</head>
<body>
<div class="ctrl">
<button onclick="toggleDark()">切换黑夜模式</button>
</div>
<div id="content">正在加载……</div>
<script>
// 这里填你仓库里txt文件名
const txtUrl="./ch1.txt";
fetch(txtUrl)
.then(res=>res.text())
.then(text=>{
document.getElementById("content").innerText=text;
})
.catch(err=>{
document.getElementById("content").innerText="读取失败，请确认txt文件已经上传";
})
function toggleDark(){document.body.classList.toggle("dark");}
</script>
</body>
</html>
